# Single-EC2 deployment: nginx is the one thing listening on 80/443, playing the role
# CloudFront + ALB play in the full AWS deployment (infra/terraform) — one public entry
# point, path-based routing to each API, static hosting for both SPAs. Everything else
# (the 3 APIs, Postgres, LocalStack, the background workers) runs via docker-compose on
# 127.0.0.1, not exposed directly.
#
# Install to /etc/nginx/sites-available/northbridge and symlink into sites-enabled
# (see deploy/ec2/README.md for the full sequence).

server {
    listen 80;
    server_name _;

    # Applicant Portal — served at the site root.
    location / {
        root /var/www/applicant-portal;
        try_files $uri $uri/ /index.html; # Angular client-side routing fallback
    }

    # Reviewer Console — served under /reviewer/, built with --base-href /reviewer/.
    location /reviewer/ {
        alias /var/www/reviewer-console/;
        try_files $uri $uri/ /reviewer/index.html;
    }

    # Applications API — matches environment.prod.ts's applicationsApiBaseUrl.
    location /applications-api/ {
        proxy_pass http://127.0.0.1:5001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Documents API — used by both SPAs.
    location /documents-api/ {
        proxy_pass http://127.0.0.1:5002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Decisioning API.
    location /decisioning-api/ {
        proxy_pass http://127.0.0.1:5003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
