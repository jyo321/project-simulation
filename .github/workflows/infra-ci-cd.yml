name: Infra CI/CD

# Kept deliberately separate from the app pipelines (docs/architecture.md §9): a network or
# schema change should never ship silently bundled with an application deploy. Plan runs on
# every PR; apply requires the `infra-prod` environment's manual approval gate.
#
# Targets one Terraform workspace/environment per run — defaults to "prod" for the
# push-to-main trigger, and can be overridden for a manual run (Actions tab → Run workflow)
# to plan/apply against dev or staging instead.
on:
  push:
    branches: [main]
    paths:
      - "infra/terraform/infrastructure/**"
  pull_request:
    paths:
      - "infra/terraform/infrastructure/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Terraform workspace to target"
        required: false
        default: "prod"
        type: string

# Required for aws-actions/configure-aws-credentials' OIDC role assumption below —
# GitHub defaults id-token to "none" regardless of repo-level workflow permissions.
permissions:
  id-token: write
  contents: read

# Queue rather than let two overlapping infra changes race each other; S3-native state
# locking would fail the second run anyway, but queueing gives a clean run instead of a
# failed one.
concurrency:
  group: infra-${{ inputs.environment || 'prod' }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: infra/terraform/infrastructure

env:
  TARGET_ENV: ${{ inputs.environment || 'prod' }}

jobs:
  # Runs on PRs too — no AWS credentials needed for fmt/validate, so PRs (which the
  # OIDC trust policy in modules/github_oidc/main.tf deliberately does not grant AWS
  # access to) still get fast feedback on syntax errors.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  # Only runs on push to main (or a manual dispatch) — this is the only trigger the OIDC
  # trust policy (repo:<owner>/<repo>:ref:refs/heads/main) actually authorizes.
  plan:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-2

      - run: terraform init
      # Selects the workspace this run targets, creating it the first time it's ever used
      # (e.g. the very first "staging" run) instead of failing because it doesn't exist yet.
      - run: terraform workspace select "$TARGET_ENV" || terraform workspace new "$TARGET_ENV"
      # -var after -var-file wins on conflict (Terraform CLI precedence) — the file supplies
      # this environment's sizing, the trailing -var overrides github_repo with wherever this
      # workflow is actually running, and DB_PASSWORD never goes in a committed file.
      - run: terraform plan -input=false -var-file="environments/$TARGET_ENV.tfvars" -var="db_password=${{ secrets.DB_PASSWORD }}" -var="github_repo=${{ github.repository }}"

  apply:
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: infra-prod # requires manual approval in repo settings
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-2

      - run: terraform init
      - run: terraform workspace select "$TARGET_ENV" || terraform workspace new "$TARGET_ENV"
      - run: terraform apply -input=false -auto-approve -var-file="environments/$TARGET_ENV.tfvars" -var="db_password=${{ secrets.DB_PASSWORD }}" -var="github_repo=${{ github.repository }}"
